<div class="mb-3 flex gap-2 items-center">
    <a kendoButton [routerLink]="'/products/add'" themeColor="primary">Add</a>
    <span class="ml-auto">Count: {{ products().length }}</span>
</div>

<kendo-grid [data]="products()" [height]="520" [sortable]="true"
    [pageable]="{ buttonCount: 5, pageSizes: [5,10,20], info: true }" [filterable]="true" [reorderable]="true"
    [resizable]="true" [columnMenu]="true">
    <kendo-grid-column title="Image" [width]="120">
        <ng-template kendoGridCellTemplate let-dataItem>
            <img *ngIf="dataItem.image" [src]="dataItem.image" alt="Product" width="60" />
        </ng-template>
    </kendo-grid-column>

    <kendo-grid-column field="name" title="Name" [width]="220"></kendo-grid-column>

    <kendo-grid-column field="price" title="Price" [width]="140">
        <ng-template kendoGridCellTemplate let-dataItem>
            <span class="cell-num" [appExpensive]="dataItem.price" [threshold]="500">
                {{ dataItem.price | currency }}
            </span>
        </ng-template>
    </kendo-grid-column>

    <kendo-grid-column field="category" title="Category" [width]="160"></kendo-grid-column>

    <kendo-grid-column field="dateOfCreation" title="Created" [width]="220">
        <ng-template kendoGridCellTemplate let-dataItem>
            <span class="cell-muted">{{ dataItem.dateOfCreation | date:'medium' }}</span>
        </ng-template>
    </kendo-grid-column>

    <kendo-grid-column title="Actions" [width]="280" [locked]="true">
        <ng-template kendoGridCellTemplate let-dataItem>
            <div class="actions">
                <a kendoButton size="small" [routerLink]="['/products', dataItem.id]"
                    [queryParams]="{ mode: 'view' }">View</a>
                <a kendoButton size="small" [routerLink]="['/products', dataItem.id]">Edit</a>
                <button kendoButton size="small" themeColor="error" (click)="remove(dataItem.id)">Delete</button>
            </div>
        </ng-template>
    </kendo-grid-column>
</kendo-grid>
