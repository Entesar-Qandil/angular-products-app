<div class="page">
  <div class="toolbar">
    <a kendoButton [routerLink]="'/products/add'" themeColor="primary">Add</a>

    <span>Category:</span>
    <kendo-dropdownlist
      [data]="categories"
      [valuePrimitive]="true"
      [ngModel]="selectedCategory()"
      (ngModelChange)="selectedCategory.set($event)"
      style="min-width:180px">
    </kendo-dropdownlist>

    <div class="spacer"></div>
    <span>Count: {{ filtered().length }}</span>
    <span style="opacity:.6">•</span>
    <span>Total: {{ totalPrice() | currency }}</span>
  </div>

  <div style="height:12px"></div>

  <kendo-grid
    [data]="filtered()"
    [height]="520"
    [sortable]="true"
    [pageSize]="10"
    [pageable]="{ buttonCount: 5, pageSizes: [5,10,20], info: true }"
    [filterable]="true"
    [reorderable]="true"
    [resizable]="true"
    [columnMenu]="true">

    <kendo-grid-column title="Image" [width]="260">
      <ng-template kendoGridCellTemplate let-dataItem>
        <div class="cell-img">
          <img *ngIf="dataItem.image" [src]="dataItem.image" alt="Product" />
          <div>
            <div style="font-weight:600">{{ dataItem.name }}</div>
            <div class="cell-muted">{{ dataItem.category }}</div>
          </div>
        </div>
      </ng-template>
    </kendo-grid-column>

    <kendo-grid-column field="price" title="Price" [width]="140">
      <ng-template kendoGridCellTemplate let-dataItem>
        <span class="cell-num" [appExpensive]="dataItem.price" [threshold]="500">
          {{ dataItem.price | currency }}
        </span>
      </ng-template>
    </kendo-grid-column>

    <kendo-grid-column field="dateOfCreation" title="Created" [width]="220">
      <ng-template kendoGridCellTemplate let-dataItem>
        <span class="cell-muted">{{ dataItem.dateOfCreation | date:'medium' }}</span>
      </ng-template>
    </kendo-grid-column>

    <kendo-grid-column title="Actions" [width]="260" [locked]="true">
      <ng-template kendoGridCellTemplate let-dataItem>
        <app-product-actions [id]="dataItem.id" (delete)="removeProduct($event)"></app-product-actions>
      </ng-template>
    </kendo-grid-column>
  </kendo-grid>
</div>
